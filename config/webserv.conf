#INFO: The class "ServerBloc" need this atributs
#port;
#serverName; #Optionnal
#headerTimeout;
#bodyTimeout;
#rootDir;
#maxBodySize;
#std::map<errorCode, htmlFile>
#
#INFO: Class "Location" need (inherits from server)
#allow_methods;
#bool autoindex;
#std::vector <redirectDir>
#bool allowUpload;
#std::string uploadDir;

http { #INFO: Global param for all server
  
  server { #INFO: Specific param for this server
    listen 80;
    server_name localhost

    #client_header_timeout; #Optionnel
    #client_body_tiemout; #Optionnel
    root www/
    client_max_body_size 1m;
    error_page 404 /404.html;

    location / { #INFO: Specific param for this location
        allow_methods "GET|POST|DELETE";
        autoindex on #directory listening
    }

    location /oldPage { #INFO: Redirection for oldPage to newPage
        return 301 /newPage
      }

    location /.php { #INFO 
        phpcgi_pass cgi/php/cgi.php
      }
      
    #NOTE: toujours pas trouver d'expemple pour l'upload de fichier avec nginx
  }
}

