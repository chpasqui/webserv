http { 

  server {
    listen 8080
    server_name localhost

    client_timeout 35
    root www/
    client_max_body_size 1000
    error_page 404 /404.html

    location / {
        allowed_methods "GET"
        autoindex on
    }

    location /post_body {
        allowed_methods POST
        client_max_body_size 100
    }

    location /cgi-bin {
        root www/cgi-bin/
        allowed_methods "POST"
        cgi_pass .bla  /home/jrandet/42/webserv/cgi_tester
    }
    
    location /directory {
        root www/YoupiBanane
        allowed_methods "GET"
        index youpi.bad_extension
    }

    location /uploadDir {
        allowed_methods "GET"
    }
  }
}
