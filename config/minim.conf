http { #INFO: Global param for all server
  
  server { #INFO: Specific param for this server
    listen 80;
    #server_name localhost;

    #client_header_timeout; #Optionnel
    #client_body_tiemout; #Optionnel
    root www/default/
    client_max_body_size 1; #m 
    error_page ;

    location { #INFO: Specific param for this location
        allow_methods "GET|POST|DELETE";
        #http redirection
        autoindex on #directory listening
    }
  }
}

