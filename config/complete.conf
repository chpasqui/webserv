http {

  server {
    listen 8080
    server_name localhost
    client_timeout 30
    root www/
    client_max_body_size 10000
    error_page 404 /errors/404.html
    error_page 405 /errors/405.html
    error_page 413 /errors/413.html

    location / {
      allowed_methods "GET|POST|DELETE"
      autoindex on
    }

    location /private {
      allowed_methods "GET"
      autoindex off
      root www/private/
    }

    location /static {
      allowed_methods "GET"
      autoindex off
      index index.html
    }

    location /uploads/ {
      root www/uploads/
      allowed_methods "GET|POST|DELETE"
      upload_store www/uploads
      autoindex on
      client_max_body_size 5000
    }

    location /uploads/big {
      allowed_methods "POST"
      upload_store www/uploads/
      client_max_body_size 100
    }

    location /readonly {
      allowed_methods "GET"
      root www/static/
      autoindex off
      index index.html
    }

    location /oldPage {
      return 301 /newPage
    }

    location /temp {
      return 302 /
    }

    location /newPage {
      allowed_methods "GET"
      root www/
      index new.html
    }

    location /cgi-bin {
      allowed_methods "GET|POST"
      root www/cgi-bin/
      cgi_pass .py  /usr/bin/python3
      cgi_pass .php /usr/bin/php-cgi
    }

    location /files {
      allowed_methods "GET"
      root www/files/
      autoindex on
    }
  }

  server {
    listen 8081
    server_name localhost
    root www/
    client_max_body_size 1000
    error_page 404 /errors/404.html

    location / {
      allowed_methods "GET"
      autoindex off
      index index.html
    }
  }

}
