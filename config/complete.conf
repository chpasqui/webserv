http {

  # ─── Serveur principal : port 8080 ───────────────────────────────────────────
  server {
    listen 8080
    server_name localhost
    client_header_timeout 35
    client_body_timeout 35
    root www/
    client_max_body_size 10000
    error_page 404 /errors/404.html
    error_page 405 /errors/405.html
    error_page 413 /errors/413.html

    # Test : GET fichier statique, autoindex, POST/DELETE généraux
    location / {
      allowed_methods "GET|POST|DELETE"
      autoindex on
    }

    # Test : autoindex OFF → 403 si pas d'index
    location /private {
      allowed_methods "GET"
      autoindex off
      root www/private/
    }

    # Test : root différente du server-level
    location /static {
      allowed_methods "GET"
      autoindex off
      index index.html
    }

    # Test : upload (POST crée, GET liste, DELETE supprime)
    location /uploads {
      allowed_methods "GET|POST|DELETE"
      upload_store www/uploads/
      autoindex on
      client_max_body_size 5000
    }

    # Test : upload avec body trop grand → 413
    location /uploads/big {
      allowed_methods "POST"
      upload_store www/uploads/
      client_max_body_size 100
    }

    # Test : GET-only → DELETE/POST → 405
    location /readonly {
      allowed_methods "GET"
      root www/static/
      autoindex off
      index index.html
    }

    # Test : redirection 301
    location /oldPage {
      return 301 /newPage
    }

    # Test : redirection 302
    location /temp {
      return 302 /
    }

    # Test : la destination de la redirection
    location /newPage {
      allowed_methods "GET"
      root www/
      index new.html
    }

    # Test : CGI Python + PHP
    location /cgi-bin {
      allowed_methods "GET|POST"
      root www/cgi-bin/
      cgi_pass .py  /usr/bin/python3
      cgi_pass .php /usr/bin/php-cgi
    }

    # Test : répertoire affiché via autoindex (listing HTML)
    location /files {
      allowed_methods "GET"
      root www/files/
      autoindex on
    }
  }

  # ─── Second serveur : port 8081 (test multi-port) ────────────────────────────
  server {
    listen 8081
    server_name localhost
    root www/
    client_max_body_size 1000
    error_page 404 /errors/404.html

    location / {
      allowed_methods "GET"
      autoindex off
      index index.html
    }
  }

}