events {

}

http { #INFO: Global param for all server

  client_header_timeout 10s;
  client_body_timeout 10s;
  keepalive_min_timeout 5s;
  keepalive_time 5s;
  keepalive_timeout 5s;
  server { #INFO: Specific param for this server
    listen 8081;

    #client_body_tiemout; #Optionnel
    root www/;
    error_page 404 /error.txt;
    client_max_body_size 1m;
    autoindex on;
    index index.html;

    #INFO: Specific param for this location
      location / {
        index test.html
        autoindex on;
      }

      # location /default/ {
      #   autoindex on;
      # }

    #INFO: Redirection for oldPage to newPage
    location /oldPage {
        return 301 /newPage;
      }

    location /uploadDir {
        limit_except POST { #allow_methods
          deny all;
        }
        return 301 /newPage;
    }
  }
}
