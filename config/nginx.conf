#INFO: The class "ServerBloc" need this atributs
#port;
#serverName; #Optionnal
#headerTimeout;
#bodyTimeout;
#rootDir;
#maxBodySize;
#std::map<errorCode, htmlFile>
#
#INFO: Class "Location" need (inherits from server)
#allow_methods;
#bool autoindex;
#std::vector <redirectDir>

events {

}

http { #INFO: Global param for all server

  server { #INFO: Specific param for this server
    listen 8081;
    #server_name localhost

    #client_header_timeout; #Optionnel
    #client_body_tiemout; #Optionnel
    root www/;
    error_page 404 /error.txt;
    client_max_body_size 1m;
    autoindex on;
    index index.html;

    #INFO: Specific param for this location
      location / {
        index test.html
        autoindex on;
      }

      # location /default/ {
      #   autoindex on;
      # }

    #INFO: Redirection for oldPage to newPage
    location /oldPage {
        return 301 /newPage;
      }

    location /uploadDir {
        limit_except POST { #allow_methods
          deny all;
        }
        return 301 /newPage;
      }
  }

  server 2 {
    
  }
}

